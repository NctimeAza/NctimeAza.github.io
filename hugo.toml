baseURL = '/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
languageName = 'zh-cn'
title = 'Rin的小窝'
theme = 'stack'
pagination.pagerSize = 5

[permalinks]
    post = '/post/:slug/'
    page = '/:slug/'

[params]
    mainSections = ['post']
    favicon = 'img/avatar.jpg'

    [params.footer]
        since = 2026
        customText = ''

    [params.dateFormat]
        published = 'Jan 02, 2006'
        lastUpdated = 'Jan 02, 2006'

    [params.sidebar]
        subtitle = '人们太渴望成功了，太执着于目的，而忘了过程同样重要。'
        emoji = ''
        compact = false
        avatar = 'img/avatar.jpg'

    [params.article]
        headingAnchor = true
        math = false
        toc = true
        readingTime = true

        [params.article.list]
            showTags = true

        [params.article.license]
            enabled = true
            default = 'Licensed under CC BY-NC-SA 4.0'

    [params.widgets]
        homepage = [
            { type = 'search' },
            { type = 'archives', params = { limit = 5 } },
            { type = 'tag-cloud', params = { limit = 10 } }
        ]
        page = [
            { type = 'toc' },
            { type = 'search' }
        ]

    [params.opengraph.twitter]
        site = ''
        card = 'summary_large_image'

    [params.colorScheme]
        toggle = true
        default = 'auto'

    [params.comments]
        enabled = false

# 主菜单在各页面 front matter 中定义(menu.main),此处勿重复定义,否则菜单项会重复
# 示例见 content/_index.md、content/page/about/index.md 等

[[menu.social]]
    identifier = 'github'
    name = 'GitHub'
    url = 'https://github.com/NctimeAza'
    [menu.social.params]
        icon = 'brand-github'
